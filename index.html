<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator — CSC426</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2d3148;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --amber:     #f59e0b;
      --amber-dim: #78460a;
      --blue:      #3b82f6;
      --red:       #ef4444;
      --green:     #22c55e;
      --radius:    14px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 380px;
    }

    .label-top {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-left: 2px;
    }

    .calc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
    }

    /* Display */
    .display {
      padding: 24px 22px 18px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
    }

    .display-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
      word-break: break-all;
      text-align: right;
      transition: color 0.2s;
    }

    .display-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: 38px;
      font-weight: 300;
      color: var(--text);
      text-align: right;
      word-break: break-all;
      line-height: 1;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .display-main.flash {
      transform: scale(0.96);
      opacity: 0.6;
    }

    /* Buttons grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .btn {
      background: var(--surface);
      border: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      padding: 0;
      height: 68px;
      cursor: pointer;
      transition: background 0.12s, transform 0.1s, color 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .btn:active { transform: scale(0.94); }

    .btn:hover { background: var(--surface2); }

    /* Button variants */
    .btn-op {
      color: var(--amber);
      font-size: 20px;
      background: rgba(245,158,11,0.06);
    }
    .btn-op:hover { background: rgba(245,158,11,0.13); }

    .btn-eq {
      background: var(--amber);
      color: #0f1117;
      font-size: 22px;
      font-weight: 600;
    }
    .btn-eq:hover { background: #f3a820; }
    .btn-eq:active { background: #d97706; }

    .btn-clear {
      color: var(--red);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: rgba(239,68,68,0.06);
    }
    .btn-clear:hover { background: rgba(239,68,68,0.13); }

    .btn-zero { grid-column: span 2; }

    .btn-back {
      color: var(--blue);
      font-size: 20px;
    }
    .btn-back:hover { background: rgba(59,130,246,0.1); }

    .btn-pow {
      color: var(--green);
      font-size: 15px;
      font-weight: 600;
    }
    .btn-pow:hover { background: rgba(34,197,94,0.08); }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      transform: scale(0);
      animation: ripple-anim 0.4s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Footer */
    .foot {
      padding: 12px 20px;
      font-size: 10px;
      color: var(--border);
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="label-top">CSC426 — Calculator</div>
    <div class="calc">

      <div class="display">
        <div class="display-expr" id="expr"></div>
        <div class="display-main" id="display">0</div>
      </div>

      <div class="grid">
        <!-- Row 1 -->
        <button class="btn btn-clear" data-action="clear">C</button>
        <button class="btn btn-back" data-action="back">⌫</button>
        <button class="btn btn-pow" data-action="op" data-val="^">xʸ</button>
        <button class="btn btn-op" data-action="op" data-val="%">%</button>

        <!-- Row 2 -->
        <button class="btn" data-action="num" data-val="7">7</button>
        <button class="btn" data-action="num" data-val="8">8</button>
        <button class="btn" data-action="num" data-val="9">9</button>
        <button class="btn btn-op" data-action="op" data-val="÷">÷</button>

        <!-- Row 3 -->
        <button class="btn" data-action="num" data-val="4">4</button>
        <button class="btn" data-action="num" data-val="5">5</button>
        <button class="btn" data-action="num" data-val="6">6</button>
        <button class="btn btn-op" data-action="op" data-val="×">×</button>

        <!-- Row 4 -->
        <button class="btn" data-action="num" data-val="1">1</button>
        <button class="btn" data-action="num" data-val="2">2</button>
        <button class="btn" data-action="num" data-val="3">3</button>
        <button class="btn btn-op" data-action="op" data-val="−">−</button>

        <!-- Row 5 -->
        <button class="btn btn-zero" data-action="num" data-val="0">0</button>
        <button class="btn" data-action="num" data-val=".">.</button>
        <button class="btn btn-op" data-action="op" data-val="+">+</button>

        <!-- Row 6 — full width equals -->
        <button class="btn btn-eq" data-action="equals" style="grid-column: span 4; height: 62px;">=</button>
      </div>

      <div class="foot">Israel Adewusi · CSC426 Practical</div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const exprEl  = document.getElementById('expr');

    let currentVal  = '0';
    let expression  = '';
    let operator    = null;
    let prevVal     = null;
    let justEvaled  = false;

    function updateDisplay(val) {
      display.textContent = val;
    }

    function flash() {
      display.classList.add('flash');
      setTimeout(() => display.classList.remove('flash'), 150);
    }

    function evaluate(a, op, b) {
      a = parseFloat(a); b = parseFloat(b);
      switch(op) {
        case '+':  return a + b;
        case '−':  return a - b;
        case '×':  return a * b;
        case '÷':  return b === 0 ? 'Error' : a / b;
        case '%':  return a % b;
        case '^':  return Math.pow(a, b);
        default:   return b;
      }
    }

    function formatResult(val) {
      if (typeof val === 'string') return val;
      // Avoid floating point mess
      let s = parseFloat(val.toPrecision(12)).toString();
      return s;
    }

    function handleNum(val) {
      if (justEvaled) {
        currentVal = val === '.' ? '0.' : val;
        expression = '';
        justEvaled = false;
      } else {
        if (val === '.' && currentVal.includes('.')) return;
        if (currentVal === '0' && val !== '.') {
          currentVal = val;
        } else {
          if (currentVal.length >= 14) return;
          currentVal += val;
        }
      }
      updateDisplay(currentVal);
    }

    function handleOp(op) {
      justEvaled = false;
      if (operator && prevVal !== null) {
        // Chain operations
        let result = evaluate(prevVal, operator, currentVal);
        result = formatResult(result);
        flash();
        expression = result + ' ' + op;
        prevVal     = result;
        currentVal  = result;
        updateDisplay(result);
      } else {
        prevVal    = currentVal;
        expression = currentVal + ' ' + op;
      }
      operator   = op;
      currentVal = '0';
      exprEl.textContent = expression;
    }

    function handleEquals() {
      if (!operator || prevVal === null) return;
      let result = evaluate(prevVal, operator, currentVal);
      result = formatResult(result);
      flash();
      exprEl.textContent = prevVal + ' ' + operator + ' ' + currentVal + ' =';
      updateDisplay(result);
      currentVal = result;
      operator   = null;
      prevVal    = null;
      justEvaled = true;
    }

    function handleClear() {
      currentVal = '0';
      operator   = null;
      prevVal    = null;
      expression = '';
      justEvaled = false;
      updateDisplay('0');
      exprEl.textContent = '';
    }

    function handleBack() {
      if (justEvaled) { handleClear(); return; }
      if (currentVal.length <= 1) {
        currentVal = '0';
      } else {
        currentVal = currentVal.slice(0, -1);
      }
      updateDisplay(currentVal);
    }

    // Button click handler
    document.querySelector('.grid').addEventListener('click', e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;

      // Ripple
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      r.style.width = r.style.height = Math.max(rect.width, rect.height) + 'px';
      r.style.left = (e.clientX - rect.left - r.offsetWidth / 2) + 'px';
      r.style.top  = (e.clientY - rect.top - r.offsetHeight / 2) + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 500);

      const action = btn.dataset.action;
      const val    = btn.dataset.val;

      if (action === 'num')    handleNum(val);
      if (action === 'op')     handleOp(val);
      if (action === 'equals') handleEquals();
      if (action === 'clear')  handleClear();
      if (action === 'back')   handleBack();
    });

    // Keyboard support
    document.addEventListener('keydown', e => {
      if ('0123456789.'.includes(e.key))         handleNum(e.key);
      else if (e.key === '+')                    handleOp('+');
      else if (e.key === '-')                    handleOp('−');
      else if (e.key === '*')                    handleOp('×');
      else if (e.key === '/')  { e.preventDefault(); handleOp('÷'); }
      else if (e.key === '%')                    handleOp('%');
      else if (e.key === '^')                    handleOp('^');
      else if (e.key === 'Enter' || e.key === '=') handleEquals();
      else if (e.key === 'Backspace')            handleBack();
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') handleClear();
    });
  </script>
</body>
</html>
